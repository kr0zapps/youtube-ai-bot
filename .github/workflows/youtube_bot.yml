name: YouTube AI Bot Automation

on:
  schedule:
    # 3 ejecuciones automáticas al día (horarios de máxima audiencia)
    - cron: '0 13 * * *'   # 10:00 AM (Chile/Arg)
    - cron: '0 19 * * *'   # 04:00 PM (Chile/Arg)
    - cron: '0 1 * * *'    # 10:00 PM (Chile/Arg)
  workflow_dispatch:        # Permite ejecutarlo manualmente con 1 clic desde la web de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar FFmpeg y fuentes Impact
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-impact

      - name: Instalar librerías Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Restaurar credenciales y tokens
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: |
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "YOUTUBE_CLIENT_SECRETS_FILE=client_secrets.json" >> .env
          echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Ejecutar generación y subida de Short a YouTube
        run: |
          python main.py --module mystery
