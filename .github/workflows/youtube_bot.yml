name: GTA 6 Clipping Page — YouTube + TikTok Automation

on:
  schedule:
    # ── 7 slots diarios (hora Santiago GMT-3 → UTC) ───────────────────────────
    # 08:00 Santiago → news
    - cron: '0 11 * * *'
    # 10:00 Santiago → tips
    - cron: '0 13 * * *'
    # 12:00 Santiago → clip
    - cron: '0 15 * * *'
    # 14:00 Santiago → news
    - cron: '0 17 * * *'
    # 17:00 Santiago → tips
    - cron: '0 20 * * *'
    # 20:00 Santiago → news
    - cron: '0 23 * * *'
    # 21:00 Santiago → clip
    - cron: '0 0 * * *'

    # ── Actualizar tendencias diarias y facts.md a las 06:00 Santiago (09 UTC) ──
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pilar GTA 6 (news | tips | clip)'
        required: true
        default: 'news'
        type: choice
        options: [news, tips, clip]
      dry_run:
        description: 'Dry-run (no sube)'
        required: false
        default: 'false'
        type: boolean
      clip_url:
        description: 'URL de clip viral (Twitter/X/TikTok/YouTube) — opcional'
        required: false
        default: ''
        type: string

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Actualizar tendencias del día + facts.md + clips relacionados
  # Corre 1x/día a las 09:00 UTC (06:00 Santiago)
  # ═══════════════════════════════════════════════════════════════════════════
  refresh-trends-and-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar FFmpeg + yt-dlp + dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar credenciales
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          if [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            echo "$YOUTUBE_COOKIES_TXT" > cookies.txt
          fi

      - name: Buscar tendencias del día y actualizar facts.md
        run: |
          python - <<'EOF'
          import logging
          logging.basicConfig(level=logging.INFO)
          import sys
          sys.path.insert(0, ".")
          from src.core import trend_fetcher

          print("=== Actualizando tendencias y facts.md ===")
          topics = trend_fetcher.fetch_live_trending_topics(max_topics=8)

          print(f"\n✓ {len(topics)} tendencias encontradas hoy:")
          for i, t in enumerate(topics, 1):
              print(f"  {i}. [{t.get('source','?')}] {t['title']}")
              print(f"     Clip relacionado: {t.get('clip_query','')}")

          # Actualizar facts.md con las noticias del día
          trend_fetcher.save_facts_update(topics)
          print("\n✓ facts.md actualizado con las tendencias de hoy.")

          # Guardar JSON con las tendencias del día para los otros jobs
          import json, os
          os.makedirs("gta6", exist_ok=True)
          with open("gta6/today_trends.json", "w", encoding="utf-8") as f:
              json.dump(topics, f, ensure_ascii=False, indent=2)
          print("✓ gta6/today_trends.json guardado.")
          EOF

      - name: Descargar clips GTA 6 relacionados a las tendencias del día
        run: |
          mkdir -p gta6/media/raw
          echo "=== Descargando clips relacionados a las tendencias de hoy ==="

          # Leer las clip_queries del JSON generado
          python - <<'EOF'
          import json, subprocess, sys, os, re
          from datetime import datetime

          trends_file = "gta6/today_trends.json"
          if not os.path.exists(trends_file):
              print("No hay today_trends.json, saltando descarga de clips.")
              sys.exit(0)

          with open(trends_file, "r", encoding="utf-8-sig") as f:
              topics = json.load(f)

          # Tomar las top 4 tendencias únicas del día
          seen_queries = set()
          queries_to_download = []
          for t in topics:
              q = t.get("clip_query", "")
              vurl = t.get("video_url", "")
              if q and q not in seen_queries:
                  seen_queries.add(q)
                  queries_to_download.append({
                      "query": q,
                      "video_url": vurl,
                      "tag": t.get("topic_tag", "general"),
                      "title": t["title"][:50],
                  })
              if len(queries_to_download) >= 4:
                  break

          print(f"Descargando clips dinámicos para {len(queries_to_download)} temas del día...")

          import random
          for item in queries_to_download:
              q = item["query"]
              vurl = item.get("video_url", "")
              tag = item["tag"]
              ts = datetime.now().strftime("%Y%m%d_%H%M%S")
              safe = re.sub(r"[^\w]", "_", tag)[:20]
              out = f"gta6/media/raw/trend_{safe}_{ts}.%(ext)s"

              print(f"\n→ Descargando clip dinámico para: {item['title']}")
              vids = []
              if not vurl:
                  from src.core.clip_downloader import find_youtube_video_ids
                  vids = find_youtube_video_ids(q, max_results=3)
              targets = [vurl] if vurl else ([f"https://www.youtube.com/watch?v={v}" for v in vids] if vids else [f"ytsearch5:{q}"])

              start_sec = random.choice([25, 45, 70, 100, 140])
              end_sec = start_sec + 58
              downloaded_ok = False
              for target in targets:
                  print(f"  Intentando destino: {target}")
                  cmd = [
                      "yt-dlp",
                      target,
                      "--match-filter", "!is_live & !was_live & duration < 900 & duration > 60",
                      f"--download-sections=*{start_sec}-{end_sec}",
                      "-f", "bestvideo[height<=1080]+bestaudio/18/best[ext=mp4]/best",
                      "--merge-output-format", "mp4",
                      "--no-playlist",
                      "--max-downloads", "1",
                      "--ignore-errors",
                      "-o", out,
                      "--no-overwrites",
                      "--extractor-args", "youtube:player_client=android,ios",
                      "--add-headers", "Accept-Language:en-US,en;q=0.9",
                      "--retries", "3",
                      "--sleep-interval", "1",
                      "--quiet",
                      "--no-warnings",
                  ]
                  if os.path.exists("cookies.txt") and os.path.getsize("cookies.txt") > 50:
                      cmd.extend(["--cookies", "cookies.txt"])
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=120)
                  # Verificar si se descargó
                  if any(f.startswith(f"trend_{safe}_{ts}") for f in os.listdir("gta6/media/raw")):
                      print(f"  ✓ Clip dinámico descargado con éxito")
                      downloaded_ok = True
                      break
                  else:
                      print(f"  ⚠ Falló candidato {target}: {result.stderr[:150]}")
              if not downloaded_ok:
                  # Respaldo en Dailymotion si YouTube está bloqueado por IP en GitHub Actions
                  from src.core.clip_downloader import find_dailymotion_video_urls
                  dm_targets = find_dailymotion_video_urls(q, max_results=3)
                  for dm_target in dm_targets:
                      print(f"  Intentando Dailymotion: {dm_target}")
                      cmd_dm = [
                          "yt-dlp",
                          dm_target,
                          f"--download-sections=*{min(start_sec, 15)}-{min(start_sec, 15) + 58}",
                          "-f", "bestvideo[height=1080]+bestaudio/bestvideo[height=720]+bestaudio/bestvideo[height>=720]+bestaudio/best[height>=720]/best",
                          "--merge-output-format", "mp4",
                          "--no-playlist",
                          "-o", out,
                          "--print", "%(width)sx%(height)s",
                          "--no-warnings",
                      ]
                      res_dm = subprocess.run(cmd_dm, capture_output=True, text=True, timeout=120)
                      if res_dm.stdout.strip():
                          print(f"  Dailymotion formato: {res_dm.stdout.strip().split(chr(10))[0]}")
                      if any(f.startswith(f"trend_{safe}_{ts}") for f in os.listdir("gta6/media/raw")):
                          print(f"  ✓ Clip dinámico descargado de Dailymotion con éxito")
                          downloaded_ok = True
                          break
                      else:
                          print(f"  ⚠ Dailymotion sección falló, reintentando clip completo...")
                          cmd_dm_full = [
                              "yt-dlp",
                              dm_target,
                              "-f", "bestvideo[height=1080]+bestaudio/bestvideo[height=720]+bestaudio/bestvideo[height>=720]+bestaudio/best[height>=720]/best",
                              "--merge-output-format", "mp4",
                              "--no-playlist",
                              "-o", out,
                              "--print", "%(width)sx%(height)s",
                              "--no-warnings",
                          ]
                          r2 = subprocess.run(cmd_dm_full, capture_output=True, text=True, timeout=120)
                          if r2.stdout.strip():
                              print(f"  Dailymotion full formato: {r2.stdout.strip().split(chr(10))[0]}")
                          subprocess.run(cmd_dm_full, capture_output=True, text=True, timeout=120)
                          if any(f.startswith(f"trend_{safe}_{ts}") for f in os.listdir("gta6/media/raw")):
                              print(f"  ✓ Clip completo descargado de Dailymotion con éxito")
                              downloaded_ok = True
                              break
              if not downloaded_ok:
                  print(f"  ⚠ No se pudo descargar ningún candidato para {item['title']}")

          # Limpiar cualquier clip que contenga nombres de juegos antiguos
          for f in os.listdir("gta6/media/raw"):
              if any(b in f.lower() for b in ["san_andreas", "sanandreas", "gta_sa", "gta4", "gta5", "gta_v", "gta3", "vice_city_2002"]):
                  try:
                      os.remove(os.path.join("gta6/media/raw", f))
                  except Exception:
                      pass

          # Listar clips disponibles
          clips = [f for f in os.listdir("gta6/media/raw") if f.endswith(".mp4")]
          print(f"\n✓ Total de clips válidos de GTA 6 disponibles: {len(clips)}")
          for c in clips:
              size = os.path.getsize(f"gta6/media/raw/{c}") / (1024*1024)
              print(f"  • {c} ({size:.1f} MB)")
          EOF

      - name: Commit tendencias del día
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔥 Auto-update: Tendencias del día GTA 6 [skip ci]"
          file_pattern: |
            gta6/facts.md
            gta6/today_trends.json

      - name: Guardar clips del día como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta6-daily-clips
          path: gta6/media/raw/*.mp4
          retention-days: 1
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Generar video y publicar en YouTube Shorts + TikTok
  # ═══════════════════════════════════════════════════════════════════════════
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    needs: [refresh-trends-and-clips]
    if: |
      always() &&
      (github.event.schedule != '0 9 * * *' || github.event_name == 'workflow_dispatch') &&
      (needs.refresh-trends-and-clips.result == 'success' || needs.refresh-trends-and-clips.result == 'skipped')

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descargar clips del día (si existen)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gta6-daily-clips
          path: gta6/media/raw

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Sistema: FFmpeg + fuentes + chromium ──────────────────────────────
      - name: Instalar FFmpeg, fuentes y herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core \
            fonts-open-sans wget xvfb
          mkdir -p ~/.local/share/fonts
          wget -q "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf" \
            -O ~/.local/share/fonts/Oswald.ttf 2>/dev/null || true
          fc-cache -f -v

      # ── 4. Dependencias Python ──────────────────────────────────────────────
      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps 2>/dev/null || true

      # ── 5. Restaurar credenciales desde GitHub Secrets ─────────────────────
      - name: Restaurar credenciales
        env:
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON:          ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          TIKTOK_SESSION_ID:           ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_COOKIES_TXT:          ${{ secrets.TIKTOK_COOKIES_TXT }}
          YOUTUBE_COOKIES_TXT:         ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY"                    >> .env
          echo "GROQ_API_KEY=$GROQ_API_KEY"                        >> .env
          echo "YOUTUBE_CLIENT_SECRETS_FILE=client_secrets.json"   >> .env
          if [ -n "$TIKTOK_SESSION_ID" ]; then
            echo "TIKTOK_SESSION_ID=$TIKTOK_SESSION_ID" >> .env
          fi

          if [ -n "$YOUTUBE_CLIENT_SECRETS_JSON" ]; then
            echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > token.json
          fi

          if [ -n "$TIKTOK_COOKIES_TXT" ]; then
            echo "$TIKTOK_COOKIES_TXT" > tiktok_cookies.txt
          fi
          if [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            echo "$YOUTUBE_COOKIES_TXT" > cookies.txt
          fi

      # ── 6. Mostrar tendencias del día (si están pre-generadas) ─────────────
      - name: Mostrar tendencias del día
        run: |
          if [ -f "gta6/today_trends.json" ]; then
            echo "=== Tendencias del día precargadas ==="
            python - <<'EOF'
          import json
          with open("gta6/today_trends.json", encoding="utf-8-sig") as f:
              topics = json.load(f)
          for i, t in enumerate(topics[:5], 1):
              print(f"{i}. [{t.get('source','?')}] {t['title']}")
              print(f"   Clip: {t.get('clip_query','')}")
          EOF
          else
            echo "No hay today_trends.json (el job refresh no corrió hoy). Se usarán las tendencias en tiempo real."
          fi

      # ── 7. Determinar pilar según hora UTC ──────────────────────────────────
      - name: Seleccionar pilar GTA 6
        id: select_pillar
        run: |
          if [ -n "${{ github.event.inputs.pillar }}" ]; then
            echo "PILLAR=${{ github.event.inputs.pillar }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%-H)
            case $HOUR in
              11|17|23) echo "PILLAR=news" >> $GITHUB_ENV ;;
              13|20)    echo "PILLAR=tips" >> $GITHUB_ENV ;;
              15|0)     echo "PILLAR=clip" >> $GITHUB_ENV ;;
              *)        echo "PILLAR=news" >> $GITHUB_ENV ;;
            esac
          fi
          echo "Pilar seleccionado: $PILLAR"

      # ── 8. Generar video y publicar (YouTube + TikTok) ─────────────────────
      - name: Generar y publicar video GTA 6
        env:
          PILLAR:       ${{ env.PILLAR }}
          CLIP_URL:     ${{ github.event.inputs.clip_url }}
          DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          CLIP_ARG=""
          [ -n "$CLIP_URL" ] && CLIP_ARG="--clip-url $CLIP_URL"

          echo "▶ python main.py --module gta6 --pillar $PILLAR $CLIP_ARG $DRY_RUN_FLAG"
          python main.py --module gta6 --pillar "$PILLAR" $CLIP_ARG $DRY_RUN_FLAG

      # ── 9. Scoreboard diario ────────────────────────────────────────────────
      - name: Revisión Scoreboard
        if: always()
        run: python main.py --review daily || true

      # ── 10. Subir artefactos (video + log) para debugging ──────────────────
      - name: Guardar video como artefacto GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-video-${{ env.PILLAR }}-${{ github.run_number }}
          path: |
            gta6/media/edits/*.mp4
            gta6/log.md
            gta6/scoreboard.csv
            gta6/today_trends.json
          retention-days: 7
