name: YouTube & TikTok AI Bot Automation

on:
  schedule:
    # 10:15 AM Chile (13:15 UTC)
    - cron: '15 13 * * *'
    # 04:15 PM Chile (19:15 UTC)
    - cron: '15 19 * * *'
    # 10:15 PM Chile (01:15 UTC dia siguiente)
    - cron: '15 1 * * *'
  workflow_dispatch:
  
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Instalar librerías Python y Playwright
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp tiktok-uploader playwright
          python -m playwright install chromium --with-deps

      - name: Restaurar credenciales y tokens (YouTube + TikTok)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_COOKIES_TXT: ${{ secrets.TIKTOK_COOKIES_TXT }}
        run: |
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "YOUTUBE_CLIENT_SECRETS_FILE=client_secrets.json" >> .env
          echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json
          if [ -n "$TIKTOK_SESSION_ID" ]; then
            echo "TIKTOK_SESSION_ID=$TIKTOK_SESSION_ID" >> .env
          fi
          if [ -n "$TIKTOK_COOKIES_TXT" ]; then
            echo "$TIKTOK_COOKIES_TXT" > tiktok_cookies.txt
          fi

      - name: Ejecutar generación y subida a YouTube y TikTok
        run: |
          python main.py --module $(python -c "import random; print(random.choice(['mystery', 'reddit', 'bizarre']))")
